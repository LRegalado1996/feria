title = "Gitleaks configuration for template"

[extend]
useDefault = true

[[allowlists]]
description = "Allow example env file placeholder values"
paths = ['''\.env\.example''', '''\.gitleaks\.toml''']

[[allowlists]]
description = "Allow CI-only test secrets in workflow files"
paths = ['''\.github/workflows/ci\.yml''']
regexTarget = "line"
regexes = ['''BETTER_AUTH_SECRET''']

[[allowlists]]
description = "Allow synthetic fixture values in tests; they are in history"
condition = "AND"
paths = ['''\.test\.tsx?$''']
regexes = ['''^synthetic-''']

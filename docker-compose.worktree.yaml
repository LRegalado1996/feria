# ==============================================================================
# Worktree overlay: host ports and the app container
# ==============================================================================
# Merged with docker-compose.base.yaml by scripts/worktree.sh, which sets:
#   FERIA_APP_PORT     host port for the app      (default: 13000)
#   FERIA_PG_PORT      host port for Postgres     (default: 15432)
#   FERIA_WORKTREE_DIR this worktree's path, recorded on every volume
# The app container is tier 2: it starts only through `pnpm wt:app`, after
# `ensure` has migrated the database.
# ==============================================================================

services:
  db:
    ports:
      - "127.0.0.1:${FERIA_PG_PORT:-15432}:5432"

  app:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app:cached
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      # pnpm's store stays OFF the bind mount: the container runs as root, so a
      # store under /app lands root-owned on the host and blocks deleting the
      # worktree. Same disk as node_modules, so hardlinks still work.
      - pnpm_store:/pnpm-store
    ports:
      - "127.0.0.1:${FERIA_APP_PORT:-13000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgresql://feria:feria@db:5432/feria"
      NEXT_TELEMETRY_DISABLED: "1"
      # The worktree's .git file points at a host path the container cannot see.
      HUSKY: "0"
      # pnpm 11 reads its store location from this variable only.
      pnpm_config_store_dir: "/pnpm-store"
      # Tells scripts/worktree.sh that `ensure` must no-op in here: compose
      # already wires the database. No NODE_ENV: `next dev` sets it, and a
      # leaked `development` breaks `next build`.
      WT_STACK_CONTAINER: "1"
    entrypoint: ["/bin/sh", "/app/scripts/worktree-entrypoint.sh"]
    healthcheck:
      # Probing / renders the root route, so keep it infrequent: it is only a
      # status signal. Readiness is gated host-side by `wt app`.
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://127.0.0.1:3000 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy

# Provenance for `pnpm wt:gc`: volumes outlive their containers, and the
# compose project label alone cannot prove which checkout owned them.
volumes:
  db-data:
    labels:
      feria.worktree-dir: ${FERIA_WORKTREE_DIR:-unknown}
  node_modules:
    labels:
      feria.worktree-dir: ${FERIA_WORKTREE_DIR:-unknown}
  next_cache:
    labels:
      feria.worktree-dir: ${FERIA_WORKTREE_DIR:-unknown}
  pnpm_store:
    labels:
      feria.worktree-dir: ${FERIA_WORKTREE_DIR:-unknown}
